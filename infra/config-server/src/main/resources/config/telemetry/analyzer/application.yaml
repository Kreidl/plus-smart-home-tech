grpc:
  client:
    hub-router:
      address: static://localhost:59090
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: plaintext

analyzer:
  kafka:
    hub-consumer-properties:
      bootstrap.servers: localhost:9092
      group.id: analyzer-snapshot
      key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value.deserializer: ru.yandex.practicum.kafka.deserializer.HubEventDeserializer
    snapshot-consumer-properties:
      bootstrap.servers: localhost:9092
      group.id: snapshot-processor
      key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value.deserializer: ru.yandex.practicum.kafka.deserializer.SensorSnapshotDeserializer
    topics:
      hub-consumer-topics: telemetry.hubs.v1
      snapshot-consumer-topics: telemetry.snapshots.v1

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/analyzer
    username: analyzer
    password: "12345"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  output:
    ansi:
      enabled: always

logging:
  level:
    ru.practicum: INFO
    org.springframework.web: ERROR
    org.apache.kafka: ERROR
    org.apache.http: ERROR